[build]
  # Apply pending Prisma migrations before building. Requires DIRECT_URL in the Netlify env. If migrations
  # fail, the build fails and the previous (working) deploy stays live — so a deploy never ships code that
  # is ahead of the database schema.
  command = "npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "https://quote-builder-pro.netlify.app/*"
  to = "https://quote-builder-pro.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://quote-builder-pro.netlify.app/*"
  to = "https://quote-builder-pro.com/:splat"
  status = 301
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
